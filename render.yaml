# Render Blueprint — Costa Bus Tracker
#
# Declara los DOS servicios Node del proyecto (no van a Netlify, que solo
# hospeda estáticos). El frontend se despliega aparte en Netlify.
#
# Uso:
#   1. Sube este archivo a la RAÍZ del repositorio.
#   2. En Render: New → Blueprint → selecciona el repo.
#   3. Completa en el panel las variables marcadas con `sync: false`:
#      - costa-bus-backend  → CORS_ORIGIN = https://tu-sitio.netlify.app
#      - costa-bus-simulator → BACKEND_URL  = https://costa-bus-backend.onrender.com

services:
  # ------------------------------------------------------------------------
  # Backend: Express + Socket.io. Recibe telemetría y la difunde por WS.
  # ------------------------------------------------------------------------
  - type: web
    name: costa-bus-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build --workspace @costa-bus/shared && npm run build --workspace @costa-bus/backend
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false

  # ------------------------------------------------------------------------
  # Simulador: emite posiciones GPS falsas cada 3 s al backend.
  # El plan Free de Render no admite `worker`, así que corre como `web`:
  # el proceso no abre puerto, pero se mantiene vivo emitiendo telemetría.
  # ------------------------------------------------------------------------
  - type: web
    name: costa-bus-simulator
    runtime: node
    plan: free
    rootDir: simulator
    buildCommand: npm ci && npm run build --workspace @costa-bus/shared && npm run build --workspace @costa-bus/simulator
    startCommand: node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BACKEND_URL
        sync: false
