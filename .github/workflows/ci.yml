name: CI

# Verifica tipos y compila cada workspace en cada push y pull request.
# No despliega: Render y Netlify despliegan solos desde GitHub (auto-deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar shared, backend, simulator y frontend
        run: npm run build
